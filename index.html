<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>A-Frame a-box Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene>
    <a-box
      position="0 1 -3"
      rotation="0 45 0"
      color="#4CC3D9"
      depth="1"
      height="1"
      width="1">
    </a-box>

    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#7BC8A4">
    </a-plane>

    <a-sky color="#ECECEC"></a-sky>

    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
</body>
</html>
